<!-- ✅ BASE_SITE_OVERRIDE_LOADED -->
{% extends "admin/base.html" %}
{% load static %}

{% block extrahead %}
{{ block.super }}
<script src="{% static 'inventory/js/common.js' %}"></script>

<script>
(function () {
  const countsUrl = "/django-admin/inventory/workflow/pending-counts/";
  const pendingUrl = "/django-admin/inventory/workflow/pending/";

  function findSidebar() {
    return document.querySelector(".sidebar, #nav-sidebar, aside");
  }

  // ✅ Find the EXISTING menu link (added by Jazzmin custom_links), do NOT create new one
  function findExistingPendingLink(sidebar) {
    if (!sidebar) return null;
    // Look for an <a> that points to pendingUrl (works regardless of its label text)
    return sidebar.querySelector('a[href="' + pendingUrl + '"]');
  }

  function ensureBadge(a) {
    if (!a) return null;

    // Avoid duplicates
    let badge = a.querySelector(".pending-badge");
    if (badge) return badge;

    // Make the link layout capable of showing a badge
    a.style.display = "flex";
    a.style.alignItems = "center";
    a.style.justifyContent = "space-between";

    badge = document.createElement("span");
    badge.className = "pending-badge";
    badge.style.display = "none";
    badge.style.minWidth = "18px";
    badge.style.height = "18px";
    badge.style.padding = "0 6px";
    badge.style.borderRadius = "999px";
    badge.style.fontSize = "12px";
    badge.style.fontWeight = "700";
    badge.style.background = "#ef4444";
    badge.style.color = "#fff";
    badge.style.textAlign = "center";
    badge.style.marginLeft = "8px";

    a.appendChild(badge);
    return badge;
  }

  async function updateBadge() {
    try {
      const sidebar = findSidebar();
      const a = findExistingPendingLink(sidebar);
      if (!a) return; // link not present for this user/role

      const badge = ensureBadge(a);
      if (!badge) return;

      const res = await fetch(countsUrl, { credentials: "same-origin" });
      if (!res.ok) return;

      const data = await res.json();
      const total = Number(data.total || 0);

      badge.textContent = String(total);
      badge.style.display = total > 0 ? "inline-block" : "none";
    } catch (e) {
      // silent
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    updateBadge();
    setInterval(updateBadge, 60000);
  });
})();
</script>

{% endblock %}
